<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Harness Desktop</title>
    <style>
      :root { color-scheme: dark; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #171717; color: #f4f4f5; }
      main { width: min(680px, calc(100vw - 48px)); }
      .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
      .mark { width: 38px; height: 38px; display: grid; place-items: center; border: 1px solid #4b5563; border-radius: 11px; font-weight: 700; }
      h1 { margin: 0; font-size: 22px; }
      .card { border: 1px solid #3f3f46; border-radius: 14px; background: #222225; padding: 24px; }
      .status { display: flex; align-items: center; gap: 12px; font-size: 16px; }
      .dot { width: 10px; height: 10px; border-radius: 50%; background: #a1a1aa; }
      .starting .dot { background: #f59e0b; animation: pulse 1.2s infinite; }
      .ready .dot { background: #22c55e; }
      .error .dot { background: #ef4444; }
      p { margin: 10px 0 0 22px; color: #a1a1aa; font-size: 14px; }
      .actions { display: none; gap: 10px; margin: 20px 0 0 22px; }
      .error .actions { display: flex; }
      button { border: 1px solid #52525b; border-radius: 8px; padding: 8px 14px; background: #303034; color: #fff; cursor: pointer; }
      button:hover { background: #3f3f46; }
      details { margin-top: 20px; border-top: 1px solid #3f3f46; padding-top: 16px; }
      summary { color: #a1a1aa; cursor: pointer; font-size: 13px; }
      pre { max-height: 280px; overflow: auto; white-space: pre-wrap; color: #d4d4d8; font: 12px/1.55 Consolas, monospace; }
      @keyframes pulse { 50% { opacity: .35; } }
    </style>
  </head>
  <body>
    <main>
      <div class="brand"><div class="mark">H</div><h1>Harness Desktop</h1></div>
      <section id="card" class="card idle">
        <div class="status"><span class="dot"></span><strong id="message">准备启动 Harness…</strong></div>
        <p>桌面应用将使用现有的 web Profile 和已安装插件。</p>
        <div class="actions"><button id="retry">重新启动</button></div>
        <details><summary>启动日志</summary><pre id="logs">暂无日志</pre></details>
      </section>
    </main>
    <script>
      const card = document.querySelector('#card')
      const message = document.querySelector('#message')
      const logs = document.querySelector('#logs')
      const render = (state) => {
        card.className = `card ${state.status}`
        message.textContent = state.message
        logs.textContent = state.logs.length ? state.logs.join('\n') : '暂无日志'
        logs.scrollTop = logs.scrollHeight
      }
      document.querySelector('#retry').addEventListener('click', () => window.harnessDesktop.retry())
      window.harnessDesktop.getState().then(render)
      window.harnessDesktop.onState(render)
    </script>
  </body>
</html>
